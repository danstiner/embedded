# Soil Sensor - BLE Advertisement Only
# Debug Configuration

# Application features
CONFIG_APP_MEASUREMENT_INTERVAL_SEC=10

# Device name for BLE
CONFIG_BT_DEVICE_NAME="Soil"

# Enable sensors and I2C bus
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

CONFIG_GPIO=y
CONFIG_ADC=y

CONFIG_STD_CPP17=y
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y

# GRTC timer for wakeup from System OFF
CONFIG_NRF_GRTC_TIMER=y

# Hardware info for reset cause detection
CONFIG_HWINFO=y

# Power Management
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# System Off (deep sleep)
CONFIG_POWEROFF=y

# Reduce memory footprint
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_IDLE_STACK_SIZE=256

# Console for debugging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Configure logging and shell
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_FUNC_NAME_PREFIX_DBG=n
CONFIG_SHELL=y
CONFIG_SHELL_LOG_BACKEND=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_CTLR_TX_PWR_MINUS_8=y

# MCUmgr for BLE DFU (OTA updates)
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y

# Flash operations for DFU
CONFIG_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_MAP=y

# Required for MCUboot image management
CONFIG_BOOTLOADER_MCUBOOT=y

# Disable SPI - using internal RRAM only
CONFIG_SPI=n
CONFIG_SPI_NOR=n

# Enable LTO to reduce flash usage
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
