[package]
name = "nrf54"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.8.0", features = ["defmt", "nrf54l15-app-s", "time-driver-rtc1", "gpiote", "unstable-pac", "time"] }
nrf-pac = { version = "0.1.0", features = ["nrf54l15-app"] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
heapless = "0.8"
rand_core = "0.9"
static_cell = "2.1"
tinyrlibc = { version = "0.5", default-features = false, features = ["strstr", "strcmp", "isupper", "utoa", "strtoul"] }
panic-rtt-target = "0.2"

[profile.dev]
# Even in debug builds, we still need to apply some optimization to have usable performance.
opt-level = "z"
debug-assertions = true 
overflow-checks = true

[[bin]]
name = "blinky"
path = "bin/blinky.rs"

[[bin]]
name = "sleep"
path = "bin/sleep.rs"

[[bin]]
name = "deep_sleep"
path = "bin/deep_sleep.rs"

[profile.release]
# LLVM can perform better optimizations using a single thread.
codegen-units = 1
opt-level = "z"
lto = "fat"
debug = 2
debug-assertions = false
overflow-checks = false
