CONFIG_MAIN_STACK_SIZE=10240

CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_ENCRYPT_IMAGE=n
CONFIG_BOOT_BOOTSTRAP=n
CONFIG_PM=n

CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

CONFIG_FLASH=y
CONFIG_FPROTECT=n

### Increase max image size
CONFIG_BOOT_MAX_IMG_SECTORS=384

### Minimal configuration to save space
CONFIG_BOOT_USE_MIN_PARTITION_SIZE=y
CONFIG_ASSERT=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_CLOCK_CONTROL=n
CONFIG_CONSOLE_HANDLER=n
CONFIG_GPIO=n
CONFIG_KERNEL_MEM_POOL=n
CONFIG_LOG=n
CONFIG_COMMON_LIBC_CALLOC=n
CONFIG_COMMON_LIBC_MALLOC=n
CONFIG_COMMON_LIBC_REALLOCARRAY=n
CONFIG_NCS_SAMPLES_DEFAULTS=n
CONFIG_NO_RUNTIME_CHECKS=y
CONFIG_NRF_RTC_TIMER=n
CONFIG_SIZE_OPTIMIZATIONS=y
# CONFIG_SYS_CLOCK_EXISTS=n
CONFIG_UART_CONSOLE=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_GPIO=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_MULTITHREADING=n
CONFIG_TICKLESS_KERNEL=n
CONFIG_CBPRINTF_NANO=y
CONFIG_MINIMAL_LIBC=y

### Minimal logging
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_CONSOLE=y
CONFIG_PRINTK=n
CONFIG_SERIAL=y

# MCUBOOT log levels are:
#  - OFF, LOG_LEVEL_ERR_OFF
#  - ERROR,  LOG_LEVEL_ERR
#  - WARNING,  LOG_LEVEL_WRN
#  - INFO,  LOG_LEVEL_INF
#  - DEBUG, LOG_LEVEL_DBG
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y

# Activate LTO
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
