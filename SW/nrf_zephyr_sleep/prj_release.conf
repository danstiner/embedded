# nRF54 Deep Sleep Example - Release Configuration Overrides
# Optimized to reduce power consumption

# Application features
CONFIG_APP_WAKEUP_INTERVAL_SEC=300

# Disable all logging
CONFIG_LOG=n

# Disable console/UART
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

# Disable assertions
CONFIG_ASSERT=n
CONFIG_ASSERT_VERBOSE=n

# Disable debug features
CONFIG_DEBUG=n
CONFIG_DEBUG_INFO=n
CONFIG_THREAD_NAME=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n

# Disable shell
CONFIG_SHELL=n
