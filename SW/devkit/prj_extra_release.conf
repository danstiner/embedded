# Kconfig overlay for release build with reduced power consumption
# Usage: west build -- -DEXTRA_CONF_FILE=prj_extra_release.conf

# Disable logging, shell, console, debug
CONFIG_LOG=n
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_SHELL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_PRINTK=n
CONFIG_PRINTK_SYNC=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_DEBUG=n
CONFIG_THREAD_NAME=n
CONFIG_ASSERT=n
CONFIG_ASSERT_VERBOSE=n
CONFIG_ASSERT_NO_FILE_INFO=y
CONFIG_RESET_ON_FATAL_ERROR=y
