# Minimal RTT debug config for dev_zephyr

# Use internal SYNTH LF clock (no external crystal)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y
CONFIG_SYSTEM_CLOCK_NO_WAIT=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

# NPM1304 PMIC
CONFIG_MFD=y
CONFIG_WATCHDOG=y
CONFIG_LED=y
CONFIG_REGULATOR=y
CONFIG_SENSOR=y

# GRTC timer
CONFIG_NRF_GRTC_TIMER=y

# RTT logging
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_LOG_BACKEND_RTT=y

# Shell over RTT
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_RTT_BUFFER=1
CONFIG_SHELL_BACKEND_SERIAL=n

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="BL54L15u DevKit"

# MCUboot
CONFIG_BOOTLOADER_MCUBOOT=y

# MCUmgr (requires ZCBOR + NET_BUF)
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# Flash for image writes
CONFIG_FLASH=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_FLASH_MAP=y

# BLE MTU optimization for fast DFU
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y

# Stack sizes
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
