[package]
name = "nrf54_embassy_matter"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-embedded-hal = { version = "0.5.0" }
embassy-executor = { version = "0.9.1", default-features = false, features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.0", default-features = false, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.8", default-features = false, features = ["defmt", "nrf54l15-app-s", "time-driver-rtc1", "gpiote", "unstable-pac", "time"] }
embassy-futures = "0.1"
embassy-sync = { version = "0.7", features = ["defmt"] }
defmt = "1.0"
defmt-rtt = "1.0"
embedded-alloc = "0.6"
rs-matter-embassy = { version = "0.1", features = ["nrf54l15-app-s", "openthread", "defmt", "kv-blob-store-16384"] }
tinyrlibc = { version = "0.5", default-features = false, features = ["strstr", "strcmp", "isupper", "utoa", "strtoul"] }
nrf-pac = { version = "0.1.0", features = ["nrf54l15-app", "defmt"] }
panic-probe = { version = "1.0", features = ["print-defmt"] }
heapless = { version = "0.9.2", features = ["defmt"] }
rand_core = "0.9"
static_cell = "2.1"
panic-rtt-target = "0.2"
rtt-target = "0.6"

nrf-sdc = { version = "0.4", default-features = false, features = ["nrf54l15-app-s", "peripheral", "defmt"] }
nrf-mpsl = { version = "0.3", default-features = false, features = ["nrf54l15-app-s", "critical-section-impl"] }

cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"

[profile.dev]
# Even in debug builds, we still need to apply some optimization to have usable performance.
opt-level = "z"
debug-assertions = true
overflow-checks = true

# Optimize crypto crates for speed instead of size to fix SPAKE2+ performance
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
# [profile.dev.package.rs-matter]
# opt-level = 2

[[bin]]
name = "light_thread"
path = "bin/light_thread.rs"

[[bin]]
name = "minimal"
path = "bin/minimal.rs"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = "fat"
debug = 2
debug-assertions = false
overflow-checks = false

# Optimize crypto crates for speed instead of size to fix SPAKE2+ performance
[profile.release.package.p256]
opt-level = 3
[profile.release.package.crypto-bigint]
opt-level = 3
[profile.release.package.elliptic-curve]
opt-level = 3
# [profile.release.package.rs-matter]
# opt-level = 2

