# Release Configuration with reduced power consumption

# Application features
CONFIG_APP_MEASUREMENT_INTERVAL_SEC=30
CONFIG_APP_BLE_ADV_INTERVAL_MS=10000
CONFIG_APP_HEATER_INTERVAL=30
CONFIG_PM=y

# Disable logging
CONFIG_LOG=n

# Disable console/UART console
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

# Disable assertions
CONFIG_ASSERT=n
CONFIG_ASSERT_VERBOSE=n

# Disable debug features
CONFIG_DEBUG=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_SHELL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_ASSERT_VERBOSE=n
CONFIG_ASSERT_NO_FILE_INFO=y
CONFIG_PRINTK=n
CONFIG_PRINTK_SYNC=n
CONFIG_THREAD_NAME=n
CONFIG_BOOT_BANNER=n

# Disable shell
CONFIG_SHELL=n
