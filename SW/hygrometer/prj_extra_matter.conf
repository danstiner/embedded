# Kconfig overlay for Matter over Thread (replaces default of BTHome)
# Usage: west build -- -DEXTRA_CONF_FILE=prj_extra_matter.conf -DSB_EXTRA_CONF_FILE=sysbuild_extra_matter.conf

CONFIG_APP_USE_MATTER=y

# Enable CHIP (Matter)
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/matter/chip_project_config.h"
# Product identity (CONFIG_CHIP_DEVICE_PRODUCT_ID / _PRODUCT_NAME) and the data model
# (CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH) are selected per board revision — layer
# prj_extra_matter_v3.conf or prj_extra_matter_v4.conf on top of this. v3 and v4 are
# different Matter products, so they use distinct PIDs (both inside the built-in test
# CD's 0x8000-0x8063 range, so no certificate work is required). VID stays 0xFFF1 (CSA
# test vendor ID) until certification.
CONFIG_STD_CPP17=y

# Enable Matter pairing automatically on application start.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# BLE advertising duration (minutes, max 15 without extended advertising)
CONFIG_CHIP_BLE_ADVERTISING_DURATION=15

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="Hygrometer"
CONFIG_BT_DEVICE_NAME_MAX=18

# Reduce application size
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n

# Enable Factory Data feature
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y

# Stack sizes for Matter
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
