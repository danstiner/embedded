# Matter data-model selection for the 2026v4 board (SHT4x + resistive leak sensor,
# no BME688/STCC4). Layer on top of prj_extra_matter.conf:
#   -DEXTRA_CONF_FILE="prj_extra_release.conf;prj_extra_matter.conf;prj_extra_matter_v4.conf"
# Build with -b bl54l15u_hygrometer@2026v4/nrf54l15/cpuapp

CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/v4/hygrometer.zap"

# Distinct Matter product identity for the v4 (leak) variant. 0x800D is covered by the
# built-in test CD (0x8000-0x8063).
CONFIG_CHIP_DEVICE_PRODUCT_ID=32781
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Leak Detector"

# Water leak (Boolean State / Water Leak Detector). Temperature + humidity + battery
# are always on; pressure/CO2 are absent on this board.
CONFIG_APP_MATTER_LEAK=y
