# Kconfig overlay for Matter over Thread (replaces default of BTHome)
# Usage: west build -- -DEXTRA_CONF_FILE=prj_extra_matter.conf -DSB_EXTRA_CONF_FILE=sysbuild_extra_matter.conf

SB_CONFIG_MATTER=y
SB_CONFIG_MATTER_FACTORY_DATA_GENERATE=n
SB_CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=n
SB_CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=n

# Package the signed app image into dfu_multi_image.bin so sysbuild wraps it
# into a Matter OTA image (matter.ota in the build dir) for OTA Software Update
SB_CONFIG_DFU_MULTI_IMAGE_PACKAGE_BUILD=y
SB_CONFIG_DFU_MULTI_IMAGE_PACKAGE_APP=y
