# Application features
CONFIG_APP_MEASUREMENT_INTERVAL_SEC=10

# BLE
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="Hygrometer"
CONFIG_BT_PERIPHERAL=y

# PMIC support (nPM2100 on hygrometer board, nPM1304 on devkit)
CONFIG_MFD=y
CONFIG_WATCHDOG=y
CONFIG_REGULATOR=y

# Enable sensors and I2C bus
CONFIG_SENSOR=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_SHT4X=y
CONFIG_SHT4X_USE_HEATER=n
CONFIG_FPU=y
CONFIG_NRF_FUEL_GAUGE=y

# GRTC timer
CONFIG_NRF_GRTC_TIMER=y

# Suspend devices when the CPU goes into sleep
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Safety
CONFIG_MPU_STACK_GUARD=y

# Memory footprint
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_IDLE_STACK_SIZE=256

# MCUmgr OTA DFU over BLE
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_CRC=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BOOTLOADER_MCUBOOT=y

# Stacks
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Reduce image size
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
