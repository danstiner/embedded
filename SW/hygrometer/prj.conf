# nRF54 Humidity Sensor - Debug Configuration
# Development build with full logging

# Application features
CONFIG_APP_MEASUREMENT_INTERVAL_SEC=10
CONFIG_APP_BLE_ADV_INTERVAL_MS=200
CONFIG_APP_BLE_ADV_WINDOW_SEC=2
CONFIG_SHT4X_USE_HEATER=n

# BLE advertising config (optional BTHome support)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Hygrometer"

# Use internal LFRC instead of LFXO (no external crystal on devkit 2026v1)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y
CONFIG_SYSTEM_CLOCK_NO_WAIT=y

# Reduce radio power usage
CONFIG_BT_CTLR_TX_PWR_MINUS_8=y

# Enable sensors and I2C bus
CONFIG_SENSOR=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

# PMIC support (nPM2100 on hygrometer board, nPM1304 on devkit)
CONFIG_MFD=y
CONFIG_WATCHDOG=y
CONFIG_LED=y
CONFIG_REGULATOR=y
CONFIG_SENSOR=y

# GRTC timer
CONFIG_NRF_GRTC_TIMER=y

CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y

# Hardware info for reset cause detection
CONFIG_HWINFO=y

# Power Management
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# System Off (deep sleep)
CONFIG_POWEROFF=y

# Memory footprint
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_IDLE_STACK_SIZE=256

# Console for debugging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Configure UART async logging and shell
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_FUNC_NAME_PREFIX_DBG=n
CONFIG_SHELL=y
CONFIG_SHELL_LOG_BACKEND=y

# MCUmgr OTA DFU over BLE
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_CRC=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y

# Button input for DFU mode trigger (devkit only)
CONFIG_INPUT=y

# LED for DFU mode indication
CONFIG_LED_GPIO=y

# Stacks — DFU path needs more
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# nRF Fuel Gauge (SoC estimation — variant set per board in boards/*.conf)
CONFIG_NRF_FUEL_GAUGE=y
