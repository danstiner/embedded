# nRF54 Humidity Sensor

# Application features
CONFIG_APP_MEASUREMENT_INTERVAL_SEC=5
CONFIG_SHT4X_USE_HEATER=n

# BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Hygrometer"
CONFIG_BT_MAX_CONN=1

# Use internal LFRC instead of LFXO (no external crystal on devkit 2026v1)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y
CONFIG_SYSTEM_CLOCK_NO_WAIT=y

# Enable sensors and I2C bus
CONFIG_SENSOR=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

# PMIC support (nPM2100 on hygrometer board, nPM1304 on devkit)
CONFIG_MFD=y
CONFIG_WATCHDOG=y
CONFIG_REGULATOR=y

# GRTC timer
CONFIG_NRF_GRTC_TIMER=y

CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y

# Power Management
CONFIG_PM=y

# Memory footprint
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_IDLE_STACK_SIZE=256

# MCUmgr OTA DFU over BLE
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_CRC=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BOOTLOADER_MCUBOOT=y

# Stacks
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# nRF Fuel Gauge (SoC estimation — variant set per board in boards/*.conf)
CONFIG_NRF_FUEL_GAUGE=y
