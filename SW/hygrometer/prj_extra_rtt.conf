# Kconfig overlay for logging via RTT.
# Usage: west build -- -DEXTRA_CONF_FILE=prj_extra_rtt.conf -Dmcuboot_EXTRA_CONF_FILE="$PWD/sysbuild/mcuboot.conf;$PWD/sysbuild/mcuboot_extra_rtt.conf"

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n

CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

CONFIG_CHIP_LOG_SIZE_OPTIMIZATION=y

# Shell over RTT
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_RTT_BUFFER=1
CONFIG_SHELL_BACKEND_SERIAL=n
