# Kconfig overlay for this project
# Overlays SW/west/ncs/bootloader/mcuboot/boot/zephyr/prj.conf

# Disable logging to reduce power (re-enabled in RTT/UART overlays)
CONFIG_LOG=n
CONFIG_CONSOLE=n

# Reduce image size
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# KMU key slots (dev + prod + backup)
CONFIG_BOOT_SIGNATURE_KMU_SLOTS=3

# Size the swap-status journal to the slot, not the 256-sector default. Frees 4KB.
CONFIG_BOOT_MAX_IMG_SECTORS=192
