# Disable flash protection for easier debugging
CONFIG_FPROTECT=n

# Disable logging
CONFIG_LOG=n

# Bootloader size optimization
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_GPIO=n

# Minimal RTT logging (UART/console disabled to save size)
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n

# RRAM access (required: nRF54L15 RRAM is accessed via the flash API)
CONFIG_FLASH=y

CONFIG_MAIN_STACK_SIZE=10240
CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_BOOTSTRAP=n
CONFIG_PM=n

# Size optimisations
CONFIG_MINIMAL_LIBC=y
CONFIG_GPIO=n
CONFIG_BOOT_MAX_IMG_SECTORS=256
CONFIG_CONSOLE_HANDLER=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_TIMESLICING=n
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_MULTITHREADING=n
CONFIG_TICKLESS_KERNEL=n
CONFIG_TIMEOUT_64BIT=n
CONFIG_NRF_ENABLE_ICACHE=n
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# KMU key slots (dev + prod + backup)
CONFIG_BOOT_SIGNATURE_KMU_SLOTS=2
