# BL54L15u Hygrometer 2026v4 board revision.
#
# Applied on top of the shared bl54l15u_hygrometer_nrf54l15_cpuapp.conf for
# builds targeting `bl54l15u_hygrometer@2026v4/...`.

# No PMIC/fuel gauge on v4 — measure the CR2 voltage with the SAADC instead.
CONFIG_ADC=y

# Leak sensing (LEAK_DRIVE/LEAK_SENSE GPIOs)
CONFIG_APP_LEAK_SENSOR=y

# v4 has no BME688/STCC4 air sensors. Disabling them trims the drivers from the
# image and, for Matter, drives APP_MATTER_PRESSURE/_CO2 off so the data model
# stays consistent with the leak (v4) zap selected by APP_LEAK_SENSOR.
CONFIG_BME688_ENABLE=n
CONFIG_STCC4_ENABLE=n

# The PMIC-related options inherited from prj.conf (NRF_FUEL_GAUGE, MFD,
# REGULATOR, WATCHDOG) stay enabled but are inert: their devicetree nodes are
# disabled on v4 so no driver instances are created. Trimming them for image
# size is a possible follow-up.
