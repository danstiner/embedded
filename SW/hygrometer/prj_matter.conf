# nRF54 Humidity Sensor — Matter/Thread build
# Activated via: -DFILE_SUFFIX=matter

CONFIG_APP_USE_MATTER=y

# GPIO and pin control (needed for PMIC, LEDs)
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_I2C=y

# PMIC support
CONFIG_MFD=y
CONFIG_WATCHDOG=y
CONFIG_REGULATOR=y

# GRTC timer
CONFIG_NRF_GRTC_TIMER=y

CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y

# Enable CHIP (Matter)
CONFIG_BT=y
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/matter/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Soily Hygrometer"
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/hygrometer.zap"
CONFIG_CHIP_DEVICE_PRODUCT_ID=32781
CONFIG_STD_CPP17=y

# Enable Matter pairing automatically on application start.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# BLE advertising duration (minutes, max 15 without extended advertising)
CONFIG_CHIP_BLE_ADVERTISING_DURATION=15

# Add support for LEDs and buttons on Nordic development kits
CONFIG_DK_LIBRARY=y

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="MatterHygrometer"
CONFIG_BT_DEVICE_NAME_MAX=18

# Suspend devices when the CPU goes into sleep
CONFIG_PM_DEVICE=y

# Other settings
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_CHIP_LIB_SHELL=n

# Reduce application size
CONFIG_USE_SEGGER_RTT=n
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n

# Enable Factory Data feature
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y

# MCUboot (required for Matter OTA)
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NET_BUF=y

# Sensor drivers
CONFIG_SENSOR=y
CONFIG_SHT4X=y
CONFIG_FPU=y
CONFIG_NRF_FUEL_GAUGE=y

# Stack sizes for Matter
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
