mcuboot:
  address: 0x0
  region: flash_primary
  size: 0xC000
mcuboot_pad:
  address: 0xC000
  region: flash_primary
  size: 0x800

# 724KB primary app partition
app:
  address: 0xC800
  region: flash_primary
  size: 0xB4800
mcuboot_primary_app:
  address: 0xC800
  region: flash_primary
  size: 0xB4800
  span: [app]
mcuboot_primary:
  address: 0xC000
  region: flash_primary
  size: 0xB5000
  span: [mcuboot_pad, app]

# 724KB secondary (equal to primary for swap mode)
mcuboot_secondary_pad:
  address: 0xC1000
  region: flash_primary
  size: 0x800
mcuboot_secondary_app:
  address: 0xC1800
  region: flash_primary
  size: 0xB4800
mcuboot_secondary:
  address: 0xC1000
  region: flash_primary
  size: 0xB5000
  span: [mcuboot_secondary_pad, mcuboot_secondary_app]

factory_data:
  address: 0x176000
  region: flash_primary
  size: 0x1000
settings_storage:
  address: 0x177000
  region: flash_primary
  size: 0x6000
