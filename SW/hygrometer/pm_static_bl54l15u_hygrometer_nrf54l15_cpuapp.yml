mcuboot:
  address: 0x0
  region: flash_primary
  size: 0xC000
mcuboot_pad:
  address: 0xC000
  region: flash_primary
  size: 0x800

# 900KB primary app partition
app:
  address: 0xC800
  region: flash_primary
  size: 0xE1000
mcuboot_primary_app:
  address: 0xC800
  region: flash_primary
  size: 0xE1000
  span: [app]
mcuboot_primary:
  address: 0xC000
  region: flash_primary
  size: 0xE1800
  span: [mcuboot_pad, app]

# 540KB secondary (holds LZMA-compressed OTA images)
mcuboot_secondary_pad:
  address: 0xED800
  region: flash_primary
  size: 0x800
mcuboot_secondary_app:
  address: 0xEE000
  region: flash_primary
  size: 0x87000
mcuboot_secondary:
  address: 0xED800
  region: flash_primary
  size: 0x87800
  span: [mcuboot_secondary_pad, mcuboot_secondary_app]

factory_data:
  address: 0x175000
  region: flash_primary
  size: 0x1000
settings_storage:
  address: 0x176000
  region: flash_primary
  size: 0x7000
