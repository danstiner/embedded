# Kconfig overlay for the standalone Zigbee router / range-extender variant.
# Mains-powered router that relays for the sleepy hygrometer end device. Flash to a
# dev board placed between the hygrometer and the coordinator.
#
# Usage (BL54L15u devkit, add prj_extra_rtt.conf for bring-up logs):
#   west build -b bl54l15u_devkit/nrf54l15/cpuapp -p -d build-router -- \
#     -DBOARD_ROOT=<abs SW dir> \
#     -DEXTRA_CONF_FILE="prj_extra_zigbee_router.conf;prj_extra_rtt.conf" \
#     -DSB_EXTRA_CONF_FILE=sysbuild_extra_zigbee.conf \
#     -DPM_STATIC_YML_FILE=$(pwd)/pm_static_zigbee.yml

CONFIG_APP_USE_ZIGBEE=y
CONFIG_APP_ZIGBEE_ROUTER=y

# Zigbee R23 stack as a router (mains powered, always on, routes for SEDs).
# (NCS_SAMPLES_DEFAULTS is intentionally not used — it enables -Werror, which trips
# on benign warnings in the precompiled ZBOSS macros.)
CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_ROUTER=y
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y

# ZBOSS needs more heap/stacks than a bare app.
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Zigbee uses the 802.15.4 radio — disable BLE and the BLE-only MCUmgr/DFU stack.
CONFIG_BT=n
CONFIG_BT_PERIPHERAL=n
CONFIG_MCUMGR=n
CONFIG_MCUMGR_TRANSPORT_BT=n
CONFIG_IMG_MANAGER=n
# Single-image, no MCUboot (see sysbuild_extra_zigbee.conf).
CONFIG_BOOTLOADER_MCUBOOT=n

# Debug over RTT via prj_extra_rtt.conf; no UART console needed.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
