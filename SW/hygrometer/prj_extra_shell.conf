# Kconfig overlay: interactive shell over RTT.
# Usage: west build -- -DEXTRA_CONF_FILE=prj_extra_shell.conf
#
# Adds the OpenThread `ot` command set for Thread diagnostics, e.g.:
#   ot state | ot parent | ot counters mle | ot childtimeout | ot pollperiod | ot neighbor table
#
# NOTE: the shell RX thread polls every CONFIG_SHELL_RTT_RX_POLL_PERIOD ms (10 ms default),
# which blocks deep sleep.

CONFIG_SHELL=y
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=256

CONFIG_USE_SEGGER_RTT=y

# OpenThread `ot ...` diagnostic commands
CONFIG_OPENTHREAD_SHELL=y

# Matter `matter ...` diagnostic commands
CONFIG_CHIP_LIB_SHELL=y
