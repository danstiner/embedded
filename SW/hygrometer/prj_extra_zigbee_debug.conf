# Temporary diagnostic overlay for root-causing the post-join bus fault.
# Layer AFTER prj_extra_zigbee.conf + prj_extra_rtt.conf:
#   -DEXTRA_CONF_FILE="prj_extra_zigbee.conf;prj_extra_rtt.conf;prj_extra_zigbee_debug.conf"
# Remove once the fault is fixed.

# Synchronous logging so the last line before a panic is actually emitted
# (deferred logging drops the ring buffer on fault).
CONFIG_LOG_MODE_IMMEDIATE=y

# DROP (don't block) when the RTT host is detached, else the backend stalls/retries
# on a full up-buffer and disrupts SED polling — a tooling artifact, not the real
# bug. With DROP, detached operation matches the no-logging production build, and
# logging resumes cleanly on reconnect.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y

# Full symbolized fault output: register dump + unwound call stack.
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_EXTRA_EXCEPTION_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y

# Reset cause read-back (hwinfo_get_reset_cause): tells us watchdog vs brownout vs
# lockup vs software reset after a *detached* failure we can't watch live.
CONFIG_HWINFO=y

# Reboot on fault so a detached hardfault leaves a breadcrumb (climbing boot count +
# SOFTWARE reset cause) instead of silently halting. The stack trace still prints
# first (immediate logging), so a tethered fault is still fully visible.
CONFIG_RESET_ON_FATAL_ERROR=y
