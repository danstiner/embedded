# Matter data-model selection for the 2026v3 board (SHT4x + BME688 + STCC4).
# Layer on top of prj_extra_matter.conf:
#   -DEXTRA_CONF_FILE="prj_extra_release.conf;prj_extra_matter.conf;prj_extra_matter_v3.conf"
# Build with -b bl54l15u_hygrometer@2026v3/nrf54l15/cpuapp

CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/v3/hygrometer.zap"

# Distinct Matter product identity for the v3 (air: pressure + CO2) variant. 0x800C has a
# bundled dev DAC and is covered by the built-in test CD (0x8000-0x8063).
CONFIG_CHIP_DEVICE_PRODUCT_ID=32780
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Hygrometer"

# Clusters present on the v3 hardware (temperature + humidity + battery are always on).
CONFIG_APP_MATTER_PRESSURE=y
CONFIG_APP_MATTER_CO2=y
# v3 has the nPM2100 fuel gauge, so battery percentage is meaningful.
CONFIG_APP_MATTER_BATTERY_PERCENT=y
