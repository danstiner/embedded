# nRF54 Soil Moisture Sensor - Debug Configuration
# Development build with full logging

# Application features
CONFIG_APP_BATTERY_MONITORING=y
CONFIG_APP_TEMPERATURE_MONITORING=y
CONFIG_APP_MEASUREMENT_INTERVAL_SEC=5

# Enable CHIP
CONFIG_CHIP=y
CONFIG_CHIP_DEVICE_PRODUCT_ID=32781
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_STD_CPP17=y
CONFIG_IEEE802154_NRF5_RX_STACK_SIZE=8192
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_CHIP_LIB_SHELL=y
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# GRTC timer for wakeup from System OFF
CONFIG_NRF_GRTC_TIMER=y

# RAM retention in System OFF
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_MUTEX_FORCE_DISABLE=y
CONFIG_RETENTION=y
CONFIG_CRC=y

# Hardware info for reset cause detection
CONFIG_HWINFO=y

# Power Management
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# System Off (deep sleep)
CONFIG_POWEROFF=y

# Memory footprint
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_IDLE_STACK_SIZE=256

# Minimal libc
CONFIG_MINIMAL_LIBC=y

# Size optimizations
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_LTO=y

# Console for debugging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Configure UART async logging and shell
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_FUNC_NAME_PREFIX_DBG=n
CONFIG_SHELL=y
CONFIG_SHELL_LOG_BACKEND=y

# Matter/CHIP size optimizations
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_CHIP_LOG_SIZE_OPTIMIZATION=y
CONFIG_CHIP_TASK_STACK_SIZE=6144
CONFIG_CHIP_MALLOC_SYS_HEAP_SIZE=8192
CONFIG_CHIP_SYSTEM_PACKETBUFFER_POOL_SIZE=10
CONFIG_CHIP_OTA_REQUESTOR_BUFFER_SIZE=512

# Reduce BLE buffers
CONFIG_BT_BUF_EVT_RX_COUNT=8
CONFIG_BT_BUF_ACL_RX_COUNT=4
CONFIG_BT_BUF_CMD_TX_COUNT=4
