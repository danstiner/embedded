# nRF54 Soil Moisture Sensor - Release/Production Configuration
# Optimized for lowest power consumption

# Application features
CONFIG_APP_BATTERY_MONITORING=y
CONFIG_APP_TEMPERATURE_MONITORING=y
CONFIG_APP_MEASUREMENT_INTERVAL_SEC=300

# Driver dependencies
CONFIG_GPIO=y
CONFIG_SENSOR=y
CONFIG_ADC=y

# GRTC timer for wakeup from System OFF
CONFIG_NRF_GRTC_TIMER=y

# RAM retention in System OFF
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_MUTEX_FORCE_DISABLE=y
CONFIG_RETENTION=y
CONFIG_CRC=y

# Hardware info for reset cause detection
CONFIG_HWINFO=y

# Power Management - aggressive power saving
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# System Off (deep sleep)
CONFIG_POWEROFF=y

# Memory footprint - same as debug for consistency
CONFIG_MAIN_STACK_SIZE=768
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=768
CONFIG_IDLE_STACK_SIZE=256

# Minimal libc
CONFIG_MINIMAL_LIBC=y

# Disable all logging in production to save power
CONFIG_LOG=n

# Disable console/UART in production to save power
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

# Disable assertions in production
CONFIG_ASSERT=n
CONFIG_ASSERT_VERBOSE=n

# Size optimizations
CONFIG_SIZE_OPTIMIZATIONS=y

# Disable debug features
CONFIG_DEBUG=n
CONFIG_DEBUG_INFO=n
CONFIG_THREAD_NAME=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n

# Disable shell
CONFIG_SHELL=n
