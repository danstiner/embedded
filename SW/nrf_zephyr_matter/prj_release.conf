# nRF54 Soil Moisture Sensor - Release Configuration Overrides
# Optimized to reduce power consumption

# Application features
CONFIG_APP_MEASUREMENT_INTERVAL_SEC=60

# Disable all logging
CONFIG_LOG=n

# Disable Matter/CHIP logging (0 = OFF)
CONFIG_CHIP_APP_LOG_LEVEL=0

# Disable console/UART
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

# Disable assertions
CONFIG_ASSERT=n
CONFIG_ASSERT_VERBOSE=n

# Disable debug features
CONFIG_DEBUG=n
CONFIG_DEBUG_INFO=n
CONFIG_THREAD_NAME=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n

# Disable shell
CONFIG_SHELL=n
CONFIG_CHIP_LIB_SHELL=n
