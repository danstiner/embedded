# Application features
CONFIG_APP_MEASUREMENT_INTERVAL_SEC=5

# BLE
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="Soil Sensor"
CONFIG_BT_PERIPHERAL=y

# NPM1304 PMIC
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_WATCHDOG=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_SENSOR=y

# FDC1004 capacitance sensor
CONFIG_FDC1004=y

# GRTC timer
CONFIG_NRF_GRTC_TIMER=y

# Suspend devices when the CPU goes into sleep
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Power down unused SRAM sections
CONFIG_RAM_POWER_DOWN_LIBRARY=y

# Safety
CONFIG_MPU_STACK_GUARD=y

# MCUmgr OTA DFU over BLE
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_CRC=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BOOTLOADER_MCUBOOT=y

# Stacks
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Reduce image size
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
