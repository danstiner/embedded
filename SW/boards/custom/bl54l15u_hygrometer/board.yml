board:
  name: bl54l15u_hygrometer
  full_name: BL54L15u Hygrometer
  vendor: custom
  socs:
    - name: nrf54l15
  revision:
    format: custom
    # 2026v4 is the current production hardware and the default. Build older
    # boards explicitly with `@2026v3`.
    default: 2026v4
    revisions:
    - name: 2026v3
    - name: 2026v4
runners:
  run_once:
    '--recover':
      - runners:
          - nrfjprog
          - nrfutil
        run: first
        groups:
          - boards:
              - bl54l15u_hygrometer
