name: Build hygrometer

on:
  push:
    paths:
      - SW/hygrometer/**
      - SW/boards/nordic/bl54l15u_devkit/**
      - SW/boards/nordic/bl54l15u_hygrometer/**
      - SW/west/**
      - .github/workflows/hygrometer.yml
  pull_request:
    paths:
      - SW/hygrometer/**
      - SW/boards/nordic/bl54l15u_devkit/**
      - SW/boards/nordic/bl54l15u_hygrometer/**
      - SW/west/**
      - .github/workflows/hygrometer.yml

jobs:
  resolve-toolchain:
    runs-on: ubuntu-24.04
    outputs:
      toolchain-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install west
        run: pip3 install west

      - name: Fetch NCS (nrf repo only)
        working-directory: SW
        run: west update --narrow -o=--depth=1 -n nrf

      - name: Resolve toolchain Docker tag
        id: tag
        run: |
          TAG=$(SW/west/ncs/nrf/scripts/print_toolchain_checksum.sh)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-toolchain
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:${{ needs.resolve-toolchain.outputs.toolchain-tag }}
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_COMPRESS: "true"
    strategy:
      matrix:
        include:
          - board: nrf54l15dk/nrf54l15/cpuapp
            name: nrf54l15dk
          - board: bl54l15u_devkit@2026v2/nrf54l15/cpuapp
            name: bl54l15u_devkit
          - board: bl54l15u_hygrometer/nrf54l15/cpuapp
            name: bl54l15u_hygrometer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update west modules
        working-directory: SW
        run: west update --narrow -o=--depth=1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-hygrometer-${{ matrix.name }}-${{ hashFiles('SW/west/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-hygrometer-${{ matrix.name }}-
            ${{ runner.os }}-ccache-hygrometer-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: ccache -M 100M

      - name: Restore signing key
        run: echo "$MCUBOOT_DEV_SIGNING_KEY" > SW/keys/dev.pem
        env:
          MCUBOOT_DEV_SIGNING_KEY: ${{ secrets.MCUBOOT_DEV_SIGNING_KEY }}

      - name: Build
        working-directory: SW
        run: |
          west build \
            -b ${{ matrix.board }} \
            -p always \
            hygrometer \
            -- -DBOARD_ROOT=$(pwd) -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Install clang-tidy
        run: |
          apt-get update && apt-get install -y --no-install-recommends clang-tidy

      - name: Run clang-tidy
        working-directory: SW
        run: |
          # Strip GCC-only flags that clang-tidy chokes on (workaround until LLVM 22)
          sed -e 's/-fno-printf-return-value//g' \
              -e 's/-fno-reorder-functions//g' \
              -e 's/-mfp16-format=ieee//g' \
              -e 's/--param=min-pagesize=0//g' \
              -e 's/--specs=picolibc\.specs//g' \
              build/hygrometer/compile_commands.json > /tmp/compile_commands.json
          find hygrometer/src -name '*.c' -o -name '*.cpp' -o -name '*.h' \
            | xargs clang-tidy -p /tmp --warnings-as-errors='*'

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hygrometer-${{ matrix.name }}
          path: |
            SW/build/merged.hex
            SW/build/dfu_application.zip
