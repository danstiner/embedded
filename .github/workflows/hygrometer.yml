name: Build hygrometer

on:
  push:
    paths:
      - SW/hygrometer/**
      - SW/boards/custom/bl54l15u_devkit/**
      - SW/boards/custom/bl54l15u_hygrometer/**
      - SW/west/**
      - SW/tidy.sh
      - .github/workflows/hygrometer.yml
  pull_request:
    paths:
      - SW/hygrometer/**
      - SW/boards/custom/bl54l15u_devkit/**
      - SW/boards/custom/bl54l15u_hygrometer/**
      - SW/west/**
      - SW/tidy.sh
      - .github/workflows/hygrometer.yml

jobs:
  resolve-toolchain:
    runs-on: ubuntu-24.04
    outputs:
      toolchain-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install west
        run: pip3 install west

      - name: Fetch NCS (nrf repo only)
        working-directory: SW
        run: west update --narrow -o=--depth=1 -n nrf

      - name: Resolve toolchain Docker tag
        id: tag
        run: |
          TAG=$(SW/west/ncs/nrf/scripts/print_toolchain_checksum.sh)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-toolchain
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:${{ needs.resolve-toolchain.outputs.toolchain-tag }}
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_COMPRESS: "true"
    strategy:
      matrix:
        include:
          - board: nrf54l15dk/nrf54l15/cpuapp
            name: nrf54l15dk
          - board: bl54l15u_devkit@2026v2/nrf54l15/cpuapp
            name: bl54l15u_devkit
          - board: bl54l15u_hygrometer@2026v3/nrf54l15/cpuapp
            name: bl54l15u_hygrometer_2026v3
          - board: bl54l15u_hygrometer@2026v4/nrf54l15/cpuapp
            name: bl54l15u_hygrometer_2026v4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update west modules
        working-directory: SW
        run: west update --narrow -o=--depth=1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-hygrometer-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-hygrometer-${{ matrix.name }}-
            ${{ runner.os }}-ccache-hygrometer-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: ccache -M 200M

      - name: Restore signing key
        run: echo "$MCUBOOT_DEV_SIGNING_KEY" > SW/keys/dev.pem
        env:
          MCUBOOT_DEV_SIGNING_KEY: ${{ secrets.MCUBOOT_DEV_SIGNING_KEY }}

      - name: Build Debug
        working-directory: SW
        run: |
          west build \
            -b ${{ matrix.board }} \
            hygrometer \
            -- -DBOARD_ROOT=$(pwd) \
            -DEXTRA_CONF_FILE="prj_extra_rtt.conf"

      - name: Install clang-tidy
        run: |
          apt-get update && apt-get install -y --no-install-recommends clang-tidy

      - name: Build BTHome Release
        working-directory: SW
        run: |
          west build \
            -b ${{ matrix.board }} \
            --build-dir build-bthome \
            hygrometer \
            -- -DBOARD_ROOT=$(pwd) \
            -DEXTRA_CONF_FILE=prj_extra_release.conf \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy (BTHome)
        working-directory: SW
        run: ./tidy.sh build-bthome "$(pwd)/hygrometer/src/"

      - name: Build Matter Release
        working-directory: SW
        run: |
          west build \
            -b ${{ matrix.board }} \
            --build-dir build-matter \
            hygrometer \
            -- -DBOARD_ROOT=$(pwd) \
            -DEXTRA_CONF_FILE="prj_extra_release.conf;prj_extra_matter.conf" \
            -DSB_EXTRA_CONF_FILE=sysbuild_extra_matter.conf \
            -DEXTRA_DTC_OVERLAY_FILE=boards/matter.overlay \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy (Matter)
        working-directory: SW
        run: ./tidy.sh build-matter "$(pwd)/hygrometer/src/"

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hygrometer-${{ matrix.name }}
          path: |
            SW/build/dfu_application.zip
            SW/build-bthome/dfu_application.zip
            SW/build-matter/dfu_application.zip
